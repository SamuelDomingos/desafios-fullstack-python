[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa-transparency"
version = "0.1.0"
description = "RPA and hyperautomation robot for querying the Brazilian Transparency Portal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Domingos" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scalar-fastapi>=1.0",
    "playwright>=1.48",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
rpa-transparency = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
