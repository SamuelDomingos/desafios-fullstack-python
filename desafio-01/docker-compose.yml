services:
  api:
    build: .
    image: rpa-transparencia:latest
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: "production"
      HEADLESS: "true"
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      MAX_CONCURRENCY: "${MAX_CONCURRENCY:-3}"
      NAVIGATION_TIMEOUT: "${NAVIGATION_TIMEOUT:-45}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
